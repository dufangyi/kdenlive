name: Build Kdenlive on Windows (MSYS2)

on:
  workflow_dispatch:      # 手动触发

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120  # MSYS2 预编译依赖，时间会短很多，120 分钟通常足够

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: kdenlive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-extra-cmake-modules
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-networkauth
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-kf6
            mingw-w64-x86_64-mlt
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-frei0r-plugins
            mingw-w64-x86_64-ladspa-sdk
            mingw-w64-x86_64-libfftw

      - name: Configure and build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/kdenlive"
          mkdir build && cd build
          
          # 使用 Ninja 加速构建，并指定安装前缀
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          
          ninja
          ninja install

      - name: Collect artifact
        shell: pwsh
        run: |
          # MSYS2 的安装前缀默认是 /mingw64，ninja install 会把文件放到 MSYS2 根目录下
          # 但我们在 CMake 中指定了 CMAKE_INSTALL_PREFIX，所以文件应该在 $GITHUB_WORKSPACE/install
          # 如果目录为空，回退到 MSYS2 的 /mingw64 目录
          $installDir = "${{ github.workspace }}\install"
          if (-not (Test-Path "$installDir\bin\kdenlive.exe")) {
            Write-Host "Install prefix empty, falling back to MSYS2 /mingw64"
            $installDir = "C:\msys64\mingw64"
          }
          
          # 打包 exe 及其所需 DLL（通过 ldd 自动收集，或直接打包整个 bin 目录）
          # 这里采取稳妥做法：打包 install 目录（如果存在）或直接打包 MSYS2 的 mingw64/bin 中 kdenlive 相关文件
          if (Test-Path "$installDir\bin\kdenlive.exe") {
            Compress-Archive -Path "$installDir\*" -DestinationPath "kdenlive-windows.zip"
          } else {
            # 最后兜底：从 MSYS2 目录中收集 kdenlive 主程序及必要 DLL
            New-Item -ItemType Directory -Force -Path "package\bin" | Out-Null
            Copy-Item "C:\msys64\mingw64\bin\kdenlive.exe" "package\bin\"
            # 简单收集 mingw64/bin 下所有 DLL，实际可能需要按 ldd 结果筛选
            Copy-Item "C:\msys64\mingw64\bin\*.dll" "package\bin\"
            Compress-Archive -Path "package\*" -DestinationPath "kdenlive-windows.zip"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-windows-msys2
          path: kdenlive-windows.zip
