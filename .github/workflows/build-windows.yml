name: Build Kdenlive Windows
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Kdenlive source
        uses: actions/checkout@v4
        with:
          path: kdenlive
          fetch-depth: 1

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kf6
            mingw-w64-ucrt-x86_64-mlt
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-kddockwidgets
            git

      - name: CMake configure & build
        run: |
          cd $GITHUB_WORKSPACE/kdenlive
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DBUILD_TESTING=OFF \
            -DQT_MAJOR_VERSION=6 \
            -DBUILD_WITH_QT6=ON \
            ..
          ninja -j${NUMBER_OF_PROCESSORS}
          ninja install

      - name: Bundle portable package (collect dlls)
        run: |
          cd $GITHUB_WORKSPACE/kdenlive/build/install
          windeployqt --release kdenlive.exe
          7z a -t7z $GITHUB_WORKSPACE/kdenlive-win-portable.7z *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-windows-portable
          path: kdenlive-win-portable.7z
